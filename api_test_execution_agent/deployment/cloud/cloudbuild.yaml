# Cloud Build configuration for deploying the API Test Execution Agent to Cloud Run.
# This file can be used for standalone API agent deployment.

steps:
  # ============================================
  # Stage 1: Build Maven modules
  # ============================================
  - name: 'amazoncorretto:27-alpine'
    id: 'maven-build'
    dir: '/workspace'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        wget -qO /tmp/maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
        echo "$$(wget -qO- https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz.sha512)  /tmp/maven.tar.gz" | sha512sum -c -
        tar xzf /tmp/maven.tar.gz -C /opt
        /opt/apache-maven-3.9.16/bin/mvn clean install -DskipTests -pl api_test_execution_agent -am

  # ============================================
  # Stage 2: Build and Push Docker Image
  # ============================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build-api-agent'
    dir: '/workspace'
    args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$_IMAGE_TAG', '-f', 'api_test_execution_agent/deployment/Dockerfile.cloud', '.' ]
    waitFor: [ 'maven-build' ]

  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-push-api-agent'
    args: [ 'push', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$_IMAGE_TAG' ]
    waitFor: [ 'docker-build-api-agent' ]

  # ============================================
  # Stage 3: Deploy to Cloud Run
  # ============================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-api-agent-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=gcr.io/$PROJECT_ID/$_SERVICE_NAME:$_IMAGE_TAG'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--ingress=internal'
      - '--allow-unauthenticated'
      - '--port=$_PORT'
      - '--memory=$_MEMORY'
      - '--cpu=$_CPU'
      - '--timeout=$_TIMEOUT'
      - '--concurrency=$_CONCURRENCY'
      - '--min-instances=$_MIN_INSTANCES'
      - '--max-instances=$_MAX_INSTANCES'
      - '--set-env-vars=DEPLOYMENT_ENV=cloud,AGENT_HOST=0.0.0.0,EXTERNAL_URL=$_EXTERNAL_URL,LOG_FORMAT=$_LOG_FORMAT,OTEL_SERVICE_NAME=$_OTEL_SERVICE_NAME,OTEL_EXPORTER_OTLP_ENDPOINT=$_OTEL_EXPORTER_OTLP_ENDPOINT,OTEL_METRICS_EXPORTER=$_OTEL_METRICS_EXPORTER,OTEL_METRIC_EXPORT_INTERVAL=$_OTEL_METRIC_EXPORT_INTERVAL'
      - '--set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest,GROQ_API_KEY=GROQ_API_KEY:latest,AGENT_AUTH_TOKEN=AGENT_AUTH_TOKEN:latest'
    waitFor: [ 'docker-push-api-agent' ]

# ============================================
# Substitutions - All configurable parameters
# ============================================
substitutions:
  _SERVICE_NAME: 'api-test-execution-agent'
  _IMAGE_TAG: 'latest'
  _REGION: 'us-central1'
  _PORT: '8005'
  _MEMORY: '2Gi'
  _CPU: '1'
  _TIMEOUT: '300'
  _CONCURRENCY: '2'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '1'
  _EXTERNAL_URL: ''
  _LOG_FORMAT: 'json'

  # --- OpenTelemetry metrics export ---
  # No endpoint means no export: the agent then keeps its instruments in memory and sends nothing.
  _OTEL_SERVICE_NAME: 'api-test-execution-agent'
  _OTEL_EXPORTER_OTLP_ENDPOINT: ''
  _OTEL_METRICS_EXPORTER: 'none'
  _OTEL_METRIC_EXPORT_INTERVAL: '60000'

options:
  logging: CLOUD_LOGGING_ONLY
