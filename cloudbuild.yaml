# Master Cloud Build configuration for deploying agents.
# Use _DEPLOY_TARGET substitution to control which agent(s) to deploy:
#   - 'all' (default): Deploy both UI and API agents
#   - 'ui': Deploy only the UI agent
#   - 'api': Deploy only the API agent
#   - 'neo4j': Deploy only the Neo4j knowledge persistence VM
#   - 'knowledge': Deploy only the procedure knowledge agent, which needs the Neo4j VM's internal Bolt URL in
#     _KNOWLEDGE_AGENT_VECTOR_DB_URL

steps:
  # ============================================
  # Stage 1: Build all Maven modules
  # ============================================
  # glibc-based, because the Node binaries the UI module's frontend build downloads do not run on Alpine's musl; they also need libatomic.
  - name: 'amazoncorretto:27-al2023'
    id: 'maven-build'
    dir: '/workspace'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        dnf install -y -q tar gzip libatomic
        curl -fsSLo /tmp/maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
        echo "$$(curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz.sha512)  /tmp/maven.tar.gz" | sha512sum -c -
        tar xzf /tmp/maven.tar.gz -C /opt
        /opt/apache-maven-3.9.16/bin/mvn clean install -DskipTests -P linux

  # ============================================
  # Stage 2: Neo4j Knowledge Persistence VM
  # Delegates to the neo4j module's cloudbuild.yaml
  # Runs when _DEPLOY_TARGET is 'neo4j'
  # ============================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-neo4j'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_DEPLOY_TARGET" = "neo4j" ]; then
          echo "Deploying Neo4j knowledge persistence VM..."
          gcloud builds submit --config=ui_test_execution_agent/deployment/neo4j/cloudbuild.yaml \
            .
        else
          echo "Skipping Neo4j deployment (_DEPLOY_TARGET=$_DEPLOY_TARGET)"
        fi
    dir: '/workspace'
    waitFor: [ '-' ]

  # ============================================
  # Stage 3: UI Test Execution Agent (VM-based)
  # Delegates to the module's own cloudbuild.yaml
  # Runs when _DEPLOY_TARGET is 'all' or 'ui'
  # ============================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-ui-agent'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_DEPLOY_TARGET" = "all" ] || [ "$_DEPLOY_TARGET" = "ui" ]; then
          echo "Deploying UI agent..."
          gcloud builds submit --config=ui_test_execution_agent/deployment/cloud/cloudbuild.yaml \
            "--substitutions=^;^_SERVICE_NAME=$_UI_AGENT_SERVICE_NAME;_IMAGE_TAG=$_IMAGE_TAG;_FIREWALL_PANEL_SOURCE_RANGES=$_FIREWALL_PANEL_SOURCE_RANGES" \
            .
        else
          echo "Skipping UI agent deployment (_DEPLOY_TARGET=$_DEPLOY_TARGET)"
        fi
    dir: '/workspace'
    waitFor: [ 'maven-build' ]

  # ============================================
  # Stage 4: API Test Execution Agent (Cloud Run)
  # Delegates to the module's own cloudbuild.yaml
  # Runs when _DEPLOY_TARGET is 'all' or 'api'
  # ============================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-api-agent'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_DEPLOY_TARGET" = "all" ] || [ "$_DEPLOY_TARGET" = "api" ]; then
          echo "Deploying API agent..."
          gcloud builds submit --config=api_test_execution_agent/deployment/cloud/cloudbuild.yaml \
            --substitutions=_SERVICE_NAME=$_API_AGENT_SERVICE_NAME,_IMAGE_TAG=$_IMAGE_TAG,_REGION=$_REGION,_PORT=8005,_MEMORY=$_API_AGENT_MEMORY,_CPU=$_API_AGENT_CPU,_EXTERNAL_URL=$_API_AGENT_EXTERNAL_URL \
            .
        else
          echo "Skipping API agent deployment (_DEPLOY_TARGET=$_DEPLOY_TARGET)"
        fi
    dir: '/workspace'
    waitFor: [ 'maven-build' ]

  # ============================================
  # Stage 5: Procedure Knowledge Agent (Cloud Run)
  # Delegates to the module's own cloudbuild.yaml
  # Runs when _DEPLOY_TARGET is 'knowledge'
  # ============================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-knowledge-agent'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_DEPLOY_TARGET" = "knowledge" ]; then
          echo "Deploying procedure knowledge agent..."
          gcloud builds submit --config=procedure_knowledge_agent/deployment/cloud/cloudbuild.yaml \
            --substitutions=_SERVICE_NAME=$_KNOWLEDGE_AGENT_SERVICE_NAME,_IMAGE_TAG=$_IMAGE_TAG,_REGION=$_REGION,_PORT=8007,_EXTERNAL_URL=$_KNOWLEDGE_AGENT_EXTERNAL_URL,_VECTOR_DB_URL=$_KNOWLEDGE_AGENT_VECTOR_DB_URL \
            .
        else
          echo "Skipping procedure knowledge agent deployment (_DEPLOY_TARGET=$_DEPLOY_TARGET)"
        fi
    dir: '/workspace'
    waitFor: [ 'maven-build' ]

substitutions:
  _DEPLOY_TARGET: 'all'  # Options: 'all', 'ui', 'api', 'neo4j', 'knowledge'
  _UI_AGENT_SERVICE_NAME: 'ui-test-execution-agent'
  _FIREWALL_PANEL_SOURCE_RANGES: ''  # Required for 'all' and 'ui': CIDR ranges allowed to reach the operator panel
  _API_AGENT_SERVICE_NAME: 'api-test-execution-agent'
  _IMAGE_TAG: 'latest'
  _REGION: 'us-central1'
  _API_AGENT_MEMORY: '2Gi'
  _API_AGENT_CPU: '1'
  _API_AGENT_EXTERNAL_URL: ''
  _KNOWLEDGE_AGENT_SERVICE_NAME: 'procedure-knowledge-agent'
  _KNOWLEDGE_AGENT_EXTERNAL_URL: ''
  _KNOWLEDGE_AGENT_VECTOR_DB_URL: ''  # Required for 'knowledge': e.g. bolt://<Neo4j VM internal IP>:7687

options:
  logging: CLOUD_LOGGING_ONLY