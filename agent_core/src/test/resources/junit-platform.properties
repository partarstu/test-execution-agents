# The smoke suite starts real HTTP servers (each on its own port) and a per-test A2A SDK request
# handler with its own background event-bus thread, plus the static push-notification config store the
# AgentExecutionResource shares across instances. Keep the run single-threaded so these servers and
# threads don't contend. This is the JUnit Platform default, pinned here to prevent an accidental
# opt-in to parallel execution from making the smoke suite flaky.
junit.jupiter.execution.parallel.enabled=false
