# =============================================================================
# Procedure Knowledge Agent Configuration
# =============================================================================
# Properties can be overridden by environment variables (see the README of this module for their names).
# =============================================================================


# =============================================================================
# AGENT CORE CONFIGURATION (Inherited from AgentConfig.java)
# =============================================================================

# -----------------------------------------------------------------------------
# MAIN CONFIG
# -----------------------------------------------------------------------------
port=8007
host=localhost
agent.version=1.0.0
debug.mode=false

# -----------------------------------------------------------------------------
# MODEL CONFIG
# -----------------------------------------------------------------------------
# Covers the thinking of a Claude model as well as its answer.
model.max.output.tokens=16000
model.temperature=0.0
model.top.p=1.0
# Logs every full model request and response; off by default because the payloads are large and carry test data.
model.logging.enabled=false
thinking.output.enabled=false
gemini.thinking.budget=0
gemini.thinking.level=low
model.max.retries=5

# -----------------------------------------------------------------------------
# GOOGLE API CONFIG
# -----------------------------------------------------------------------------
google.api.provider=studio_ai
google.api.token=XYZ
google.project=XYZ
google.location=XYZ

# -----------------------------------------------------------------------------
# OPENAI API CONFIG (DIRECT)
# -----------------------------------------------------------------------------
openai.api.key=XYZ
openai.endpoint=https://api.openai.com/v1/

# -----------------------------------------------------------------------------
# AZURE OPENAI API CONFIG
# -----------------------------------------------------------------------------
azure.openai.api.key=XYZ
azure.openai.endpoint=XYZ

# -----------------------------------------------------------------------------
# GROQ API CONFIG
# -----------------------------------------------------------------------------
groq.api.key=XYZ
groq.endpoint=XYZ

# -----------------------------------------------------------------------------
# ANTHROPIC API CONFIG
# -----------------------------------------------------------------------------
anthropic.api.provider=anthropic_api
anthropic.api.key=XYZ
anthropic.endpoint=https://api.anthropic.com/v1/
# Without thinking, a Claude model reused fewer of the matching procedures.
anthropic.thinking.enabled=true
anthropic.thinking.effort=medium

# -----------------------------------------------------------------------------
# H COMPANY (HOLO) API CONFIG
# -----------------------------------------------------------------------------
hcompany.api.key=XYZ
hcompany.endpoint=https://api.hcompany.ai/v1/

# -----------------------------------------------------------------------------
# QWEN API CONFIG
# -----------------------------------------------------------------------------
qwen.api.key=
qwen.endpoint=
# Whether a Qwen model driving a sub-agent thinks before it acts.
qwen.agent.thinking.enabled=true

# -----------------------------------------------------------------------------
# TIMEOUT AND RETRY CONFIG (CORE)
# -----------------------------------------------------------------------------
test.step.execution.retry.timeout.millis=1000
test.step.execution.retry.interval.millis=500
verification.retry.timeout.millis=1000
max.action.execution.duration.millis=5000

# -----------------------------------------------------------------------------
# AGENT BUDGETS
# -----------------------------------------------------------------------------
# The budget covers the whole request: one item run per precondition and test step plus the aggregation run, each up to
# knowledge.exploration.max.tool.calls tool calls that resend the growing conversation, e.g. 30 runs of about 150000 tokens.
agent.token.budget=5000000
agent.tool.calls.budget.unattended=5
# Bounds the selection runs of a request (item and aggregation runs); below the design agent's request timeout (900 s) so that a slow request fails here first.
agent.execution.time.budget.seconds=840

# -----------------------------------------------------------------------------
# KNOWLEDGE GRAPH
# -----------------------------------------------------------------------------
vector.db.provider=neo4j
vector.db.url=bolt://localhost:7687
neo4j.username=neo4j
neo4j.database=neo4j
neo4j.max.connection.pool.size=20
neo4j.connection.acquisition.timeout.seconds=30
neo4j.connection.timeout.seconds=10
neo4j.max.transaction.retry.time.seconds=120
# Must be the embedding model of the UI agents that recorded the procedures, otherwise the search compares incompatible vectors.
knowledge.embedding.model=bge-small-en-v15
knowledge.embedding.batch.size=10
# Smoothing factors of the execution statistics the shared graph code updates; this agent only reads the graph and never uses them.
timing.ewma.alpha=0.2
stability.ewma.alpha=0.3

# -----------------------------------------------------------------------------
# EXPLORATION AND SELECTION
# -----------------------------------------------------------------------------
# Below the UI agents' execution floor (0.88), because the wording of designed test cases differs from the recorded wording.
knowledge.search.min.score=0.80
knowledge.search.top.n=10
knowledge.selection.max.per.item=3
knowledge.selection.max.retries=3
knowledge.exploration.max.tool.calls=40
knowledge.max.depth=5
knowledge.tree.max.nodes=200

# -----------------------------------------------------------------------------
# REQUESTS AND CONCURRENCY
# -----------------------------------------------------------------------------
knowledge.request.max.items=100
knowledge.request.max.text.length=4000
# Item runs of all tasks share these slots, so that several test cases at once stay within the model provider's rate limits.
knowledge.item.concurrency=8
# Advertised in the agent card, so that the orchestrator sends this many tasks at the same time.
knowledge.task.capacity=4

# -----------------------------------------------------------------------------
# AGENT SPECIFIC CONFIGS
# -----------------------------------------------------------------------------
procedure.item.selection.agent.model.name=gemini-3.8-flash
procedure.item.selection.agent.model.provider=google
procedure.item.selection.agent.prompt.version=v1.0.0

procedure.aggregation.selection.agent.model.name=gemini-3.8-flash
procedure.aggregation.selection.agent.model.provider=google
procedure.aggregation.selection.agent.prompt.version=v1.0.0
