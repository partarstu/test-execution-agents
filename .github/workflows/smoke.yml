name: Smoke Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      # The UI agent's smoke suite mocks the screen, but any AWT/Swing class that loads still needs a
      # display on headless Linux, so the run happens under a virtual X server (xvfb-run) rather than
      # with -Djava.awt.headless=true, which would break the agent's AWT Robot paths.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Smoke tests are excluded from the default build (excludedGroups=smoke); here that exclusion is
      # cleared and we opt in with -Dgroups=smoke so ONLY @Tag("smoke") tests run. -P linux pulls the
      # Linux-native OpenCV/JavaCV binaries the UI module needs to compile and load.
      - name: Run smoke tests
        run: >
          xvfb-run -a mvn -B test -P linux
          -Dtest.excluded.groups=
          -Dgroups=smoke
