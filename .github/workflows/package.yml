name: Package Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        id: setup
        with:
          java-version: '27'
          distribution: 'corretto'
          cache: 'maven'

      # The Maven cache above already holds the Node archive the frontend build downloads; this caches npm's packages.
      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('ui_test_execution_agent/src/main/frontend/package-lock.json') }}

      - name: Package UI agent
        run: mvn -B package --file pom.xml -pl ui_test_execution_agent -am -P linux

      - name: Package API agent
        if: always() && steps.setup.conclusion == 'success'
        run: mvn -B package --file pom.xml -pl api_test_execution_agent -am -P linux

      - name: Package procedure knowledge agent
        if: always() && steps.setup.conclusion == 'success'
        run: mvn -B package --file pom.xml -pl procedure_knowledge_agent -am -P linux