# The UI smoke suite drives the whole UiTestAgent flow with process-global test doubles: a MockedStatic stub
# of UiCommonUtils.captureScreen (a JVM-global mock that must not overlap across threads), a shared
# BudgetManager and background procedure-prefetch threads started by the orchestrator. Keep the run
# single-threaded so these doubles and threads don't contend. This is the JUnit Platform default, pinned here
# to prevent an accidental opt-in to parallel execution from making the suite flaky.
junit.jupiter.execution.parallel.enabled=false
