# Cloud Build configuration for deploying Neo4j to a dedicated GCE VM.
# No Maven build or Docker image build needed — uses public neo4j:5-community image.

steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-neo4j-chmod'
    entrypoint: 'bash'
    args: [ '-c', 'chmod +x ui_test_execution_agent/deployment/neo4j/deploy_neo4j_vm.sh' ]
    dir: '/workspace'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-neo4j-vm'
    entrypoint: 'bash'
    args: [ '-c', 'ui_test_execution_agent/deployment/neo4j/deploy_neo4j_vm.sh' ]
    dir: '/workspace'
    env:
      # --- GCP Configuration ---
      - 'REGION=$_REGION'
      - 'ZONE=$_ZONE'
      - 'INSTANCE_NAME=$_INSTANCE_NAME'
      - 'NETWORK_NAME=$_NETWORK_NAME'
      - 'SUBNET_NAME=$_SUBNET_NAME'
      - 'MACHINE_TYPE=$_MACHINE_TYPE'
      # --- Neo4j Settings ---
      - 'NEO4J_HEAP_SIZE=$_NEO4J_HEAP_SIZE'
      - 'NEO4J_PAGECACHE_SIZE=$_NEO4J_PAGECACHE_SIZE'
      - 'NEO4J_BOLT_PORT=$_NEO4J_BOLT_PORT'
      # --- GCP Infrastructure ---
      - 'GCP_SERVICES=$_GCP_SERVICES'
      - 'DATA_DISK_NAME=$_DATA_DISK_NAME'
      - 'DATA_DISK_SIZE=$_DATA_DISK_SIZE'
      - 'DATA_DISK_TYPE=$_DATA_DISK_TYPE'
      - 'GCE_IMAGE=$_GCE_IMAGE'
      - 'BOOT_DISK_SIZE=$_BOOT_DISK_SIZE'
      - 'BOOT_DISK_TYPE=$_BOOT_DISK_TYPE'
      - 'STATIC_IP_ADDRESS_NAME=$_STATIC_IP_ADDRESS_NAME'
      - 'SECRET_ACCESSOR_ROLE=$_SECRET_ACCESSOR_ROLE'
      - 'CLOUD_PLATFORM_SCOPE=$_CLOUD_PLATFORM_SCOPE'
      - 'PROVISIONING_MODEL=$_PROVISIONING_MODEL'
      - 'INSTANCE_TERMINATION_ACTION=$_INSTANCE_TERMINATION_ACTION'
      - 'MAX_VM_RUN_DURATION=$_MAX_VM_RUN_DURATION'
      - 'INSTANCE_STATUS_CHECK_INTERVAL=$_INSTANCE_STATUS_CHECK_INTERVAL'
      - 'CONTAINER_VM_LABEL=$_CONTAINER_VM_LABEL'
    waitFor: [ 'deploy-neo4j-chmod' ]

substitutions:
  # --- GCP Configuration ---
  _REGION: 'us-central1'
  _ZONE: 'us-central1-a'
  _INSTANCE_NAME: 'neo4j-knowledge-vm'
  _NETWORK_NAME: 'agent-network'
  _SUBNET_NAME: 'agent-network'
  _MACHINE_TYPE: 'e2-medium'

  # --- Neo4j Settings ---
  _NEO4J_HEAP_SIZE: '512m'
  _NEO4J_PAGECACHE_SIZE: '256m'
  _NEO4J_BOLT_PORT: '7687'

  # --- GCP Infrastructure ---
  _GCP_SERVICES: 'compute.googleapis.com secretmanager.googleapis.com'
  _DATA_DISK_NAME: 'neo4j-data-disk'
  _DATA_DISK_SIZE: '10GB'
  _DATA_DISK_TYPE: 'pd-balanced'
  _GCE_IMAGE: 'projects/cos-cloud/global/images/cos-121-18867-90-106'
  _BOOT_DISK_SIZE: '10GB'
  _BOOT_DISK_TYPE: 'pd-balanced'
  _STATIC_IP_ADDRESS_NAME: 'neo4j-knowledge-ip'
  _SECRET_ACCESSOR_ROLE: 'roles/secretmanager.secretAccessor'
  _CLOUD_PLATFORM_SCOPE: 'https://www.googleapis.com/auth/cloud-platform'
  _PROVISIONING_MODEL: 'SPOT'
  _INSTANCE_TERMINATION_ACTION: 'STOP'
  _MAX_VM_RUN_DURATION: '18000s'
  _INSTANCE_STATUS_CHECK_INTERVAL: '5'
  _CONTAINER_VM_LABEL: 'cos-121-18867-90-106'

options:
  logging: CLOUD_LOGGING_ONLY
