# Builds the Holo grounding image with the model weights baked in, and keeps GCS as the source of truth for them.
# Submit from this directory:
#   gcloud builds submit --config cloudbuild.yaml --project "$PROJECT_ID" .
substitutions:
  _MODEL_REPO: Hcompany/Holo-3.1-35B-A3B-NVFP4
  _MODEL_DIR: Holo-3.1-35B-A3B-NVFP4
  _IMAGE: europe-west4-docker.pkg.dev/${PROJECT_ID}/holo/holo-35b-nvfp4:vllm-8efa13b
  _WEIGHTS_BUCKET: gs://${PROJECT_ID}-holo-weights

steps:
  - id: download-weights
    name: python:3.14-slim
    env:
      - MODEL_REPO=${_MODEL_REPO}
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      pip install --no-cache-dir --quiet "huggingface_hub==2.0.0"
      python - <<'PY'
      import os
      from huggingface_hub import snapshot_download

      snapshot_download(
          os.environ["MODEL_REPO"],
          local_dir="/workspace/model",
          # Everything vLLM needs to serve, without the repo's documentation and git metadata.
          allow_patterns=["*.json", "*.safetensors", "*.jinja"],
          max_workers=8,
      )
      PY
      du -sh /workspace/model

  - id: mirror-weights-to-gcs
    name: gcr.io/cloud-builders/gcloud
    args:
      - storage
      - rsync
      - --recursive
      - /workspace/model
      - ${_WEIGHTS_BUCKET}/${_MODEL_DIR}

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args: [build, --tag, '${_IMAGE}', --file, Dockerfile, .]

images:
  - '${_IMAGE}'

options:
  # Lets the substitutions above expand the built-in ${PROJECT_ID} on a manually submitted build.
  dynamicSubstitutions: true
  machineType: E2_HIGHCPU_32
  # The weights land on disk three times over: downloaded, sent to the docker daemon as build context, and stored
  # again in the image layer.
  diskSizeGb: 300

timeout: 7200s
